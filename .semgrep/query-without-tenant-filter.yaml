rules:
  - id: query-without-tenant-filter
    languages: [python]
    severity: ERROR
    message: >-
      Query on a tenant-owned table without a tenant filter. In a pooled multi-tenant service every read, update and
      delete of tenant data must be scoped to the tenant from the verified identity, otherwise one tenant can reach
      another tenant's rows (cross-tenant BOLA). Add `tenant = ?` bound to the caller's tenant. If the query is
      intentionally cross-tenant (seeding, admin job), mark it with `# nosemgrep: query-without-tenant-filter` and a
      reason.
    metadata:
      category: security
      cwe: "CWE-639: Authorization Bypass Through User-Controlled Key"
      owasp: "API1:2023 Broken Object Level Authorization"
      confidence: MEDIUM
      references:
        - https://github.com/hleb-straltsou-by/appsec-pipeline#custom-semgrep-rule
    # Tenant-owned tables. Extend the list when a new table holds tenant data.
    patterns:
      - pattern-either:
          - pattern: $DB.execute("$SQL", ...)
          - pattern: $DB.executemany("$SQL", ...)
      - metavariable-regex:
          metavariable: $SQL
          # SELECT ... FROM notes / UPDATE notes / DELETE FROM notes, with no "tenant =" anywhere in the statement
          regex: (?is)^(?!.*\btenant\s*=)\s*(select\b.*\bfrom|update|delete\s+from)\s+notes\b
