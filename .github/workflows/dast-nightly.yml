# Nightly active DAST (week 4, Monday notes: heavy DAST runs at night, results become a ticket, not a red build).
#
# Unlike the PR job, this one ATTACKS: ZAP sends SQL injection, command injection and other payloads to every
# endpoint in api/openapi.yaml. That's why it runs only against a throwaway container on the runner — never
# against a shared environment, never against production.
name: dast-nightly

on:
  schedule:
    - cron: "17 2 * * *"     # 02:17 UTC daily (an odd minute avoids the top-of-hour queue)
  workflow_dispatch:

permissions:
  contents: read

env:
  ZAP_IMAGE: "ghcr.io/zaproxy/zaproxy:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab"

jobs:
  active-scan:
    name: DAST (ZAP active API scan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write          # open or update the tracking issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start the service
        run: |
          docker build -t app:dast .
          docker run -d --name app -p 8080:8080 app:dast
          for i in $(seq 1 30); do curl -sf http://localhost:8080/health && exit 0; sleep 1; done
          docker logs app; exit 1

      - name: ZAP API scan, active
        run: |
          mkdir zapwrk && cp api/openapi.yaml zapwrk/ && chmod -R a+rwX zapwrk
          # Exit code ignored on purpose: the nightly result is a ticket, not a failed build.
          docker run --rm --network host -v "$PWD/zapwrk:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-api-scan.py -t openapi.yaml -f openapi \
            -r api-active.html -J api-active.json || true

      - name: Summary
        if: always()
        run: |
          {
            echo '### Active API scan'
            echo '| Risk | Alert | Rule | URLs |'
            echo '|---|---|---|---|'
            jq -r '[.site[].alerts[]] | sort_by(-(.riskcode|tonumber))[] | "| \(.riskdesc|split(" ")[0]) | \(.alert) | \(.pluginid) | \(.count) |"' zapwrk/api-active.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap-report-nightly
          path: |
            zapwrk/*.html
            zapwrk/*.json

      - name: Ticket for High findings
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          high=$(jq '[.site[].alerts[] | select(.riskcode == "3")] | length' zapwrk/api-active.json)
          echo "High alerts: $high"
          [ "$high" -gt 0 ] || exit 0
          title="Nightly DAST: High findings"
          body=$(printf 'Run: %s\n\n| Alert | Rule | URLs |\n|---|---|---|\n%s\n\nOwner: service team. SLA for High: 7 days (README, policy).' \
            "$RUN_URL" \
            "$(jq -r '[.site[].alerts[] | select(.riskcode == "3")][] | "| \(.alert) | \(.pluginid) | \(.count) |"' zapwrk/api-active.json)")
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"     # one living ticket, not a new one every night
          else
            gh issue create --title "$title" --body "$body"
          fi
